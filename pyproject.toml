[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scbi"
version = "0.1.0"
description = "Self-Consistent Basis Invention (SCBI) Research Framework"
readme = "README.md"
authors = [
    { name = "SCBI Research Team" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "accelerate>=0.26.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
tracking = [
    "wandb>=0.16.0",
    "tensorboard>=2.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scbi*"]
